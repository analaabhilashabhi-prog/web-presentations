<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowlytics</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;font:13px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#1B1B1B;background:#F7F6F5;}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid rgba(27,27,27,.08);}
  .mark{width:18px;height:18px;border-radius:5px;background:#EF5F22;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;}
  .brand{font-weight:600;letter-spacing:-.01em;}
  nav{margin-left:auto;display:flex;gap:4px;}
  nav button{border:0;background:none;font:inherit;font-size:11px;color:#6E6862;padding:4px 8px;border-radius:999px;cursor:pointer;}
  nav button[aria-current="true"]{background:#EF5F22;color:#fff;}
  main{padding:14px;}
  h1{margin:0 0 3px;font-size:16px;letter-spacing:-.02em;}
  .sub{margin:0 0 12px;font-size:11.5px;color:#6E6862;}
  ul{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;}
  li{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid rgba(27,27,27,.08);border-radius:8px;padding:8px 10px;font-size:11.5px;cursor:pointer;}
  li:hover{border-color:#EF5F22;}
  li b{font-weight:600;color:#EF5F22;font-size:10px;}
  .go{border:0;border-radius:999px;background:#EF5F22;color:#fff;font:inherit;font-size:12px;font-weight:600;padding:8px 16px;cursor:pointer;}
  .go:hover{filter:brightness(.94);}
  .out{margin-top:10px;font-size:11.5px;color:#2A2723;background:#fff;border:1px dashed #EF5F22;border-radius:8px;padding:8px 10px;min-height:32px;}
  footer{position:fixed;left:0;right:0;bottom:0;padding:5px 14px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#A29B95;background:#F7F6F5;}
</style>
</head>
<body>
<header>
  <span class="mark">C</span>
  <span class="brand">Crowlytics</span>
  <nav><button type="button" aria-current="true">Practice</button><button type="button" aria-current="false">Mocks</button><button type="button" aria-current="false">Analytics</button></nav>
</header>
<main>
  <h1>Mock 12 · Quantitative</h1>
  <p class="sub">20 questions · 25 minutes · recruiter pattern</p>
  <ul><li><span>Percentages</span><b>92%</b></li><li><span>Time and work</span><b>71%</b></li><li><span>Probability</span><b>64%</b></li></ul>
  <button class="go" type="button">Start mock</button>
  <div class="out" id="out">Demo build — placeholder data.</div>
</main>
<footer>Crowlytics · demo</footer>
<script>
  const out = document.getElementById('out');
  document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-current', String(x === b)));
    out.textContent = b.textContent + ' \u2014 placeholder view.';
  }));
  document.querySelectorAll('li').forEach((li) => li.addEventListener('click', () => {
    out.textContent = 'Opened: ' + li.firstElementChild.textContent;
  }));
  document.querySelector('.go').addEventListener('click', () => { out.textContent = "Timer running · question 1 of 20"; });
</script>
</body>
</html>
